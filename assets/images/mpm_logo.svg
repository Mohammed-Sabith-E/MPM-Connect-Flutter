<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="mpmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#00162D" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Brand Emblem Mark -->
  <rect x="16" y="18" width="84" height="84" rx="20" fill="url(#mpmGrad)" />
  
  <!-- Subtle inner geometric accent -->
  <polygon points="32,74 48,38 60,60 72,38 88,74 76,74 68,54 60,70 52,54 44,74" fill="#FFFFFF" />
  <circle cx="82" cy="34" r="6" fill="url(#amberGrad)" />

  <!-- Typography: MPM -->
  <text x="120" y="66" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#00162D" letter-spacing="-0.5">MPM</text>
  
  <!-- Typography: CONNECT -->
  <text x="238" y="66" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="300" fill="#D97706" letter-spacing="-0.5">CONNECT</text>
  
  <!-- Subtitle / Brand Tagline -->
  <text x="122" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3.0">ENTERPRISE LEDGER</text>
</svg>
