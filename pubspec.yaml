name: mpm_connect
description: "MPM Connect - Customer Invoice, Credit, Payment Settlement & Collection Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Typography & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  intl: ^0.19.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Firebase Core & Firestore
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_dotenv: ^5.2.1
  flutter_contacts: ^1.1.9+2
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.1

dependency_overrides:
  permission_handler_android: 13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
